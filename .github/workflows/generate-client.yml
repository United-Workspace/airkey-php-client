name: Generate AirKey Client
on:
  workflow_dispatch:
  schedule:
    # Run every Tuesday at 09:00 UTC to check for upstream API updates
    - cron: '0 9 * * 2'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring
          tools: composer

      - name: Fetch & Enrich API Specification
        run: |
          SWAGGER_URL=$(jq -r '.swaggerUrl' .generator/openapi-config.json)
          echo "Fetching spec from $SWAGGER_URL..."
          curl -s "$SWAGGER_URL" -o .generator/swagger.json
          
          echo "Applying enrichments..."
          php .generator/scripts/enrich-spec.php \
            --spec=.generator/swagger.json \
            --enrichments=.generator/enrichments.json \
            --output=.generator/swagger.json

      - name: Generate SDK with OpenAPI Generator
        run: |
          GEN_VERSION=$(jq -r '.generatorVersion // "latest"' .generator/openapi-config.json)
          echo "Running openapitools/openapi-generator-cli:${GEN_VERSION}..."
          
          mkdir -p .generator/generated-client
          
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/local \
            openapitools/openapi-generator-cli:${GEN_VERSION} generate \
            -i /local/.generator/swagger.json \
            -g php \
            -c /local/.generator/openapi-config.json \
            -o /local/.generator/generated-client
            
          echo "Extracting generated source files..."
          mkdir -p lib docs test
          cp -R .generator/generated-client/lib/. lib/ || true
          cp -R .generator/generated-client/docs/. docs/ || true
          cp -R .generator/generated-client/test/. test/ || true
          cp .generator/generated-client/README.md API_README.md || true
          rm -rf .generator/generated-client

      - name: Restore Protected Files
        run: |
          # Keep custom serializer discriminator logic safe if present
          git checkout HEAD -- lib/ObjectSerializer.php || true

      - name: Validate Composer Package
        run: |
          composer validate --strict

      - name: Check for Changes & Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Check if git working directory has any changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "✅ No changes detected after generation. SDK is completely up-to-date."
            exit 0
          fi
          
          echo "Changes detected in generated code or specification."
          SWAGGER_VERSION=$(jq -r '.info.version' .generator/swagger.json | tr -d '[:space:]')
          BRANCH_NAME="update-client-${SWAGGER_VERSION}"
          
          # 2. Check if a PR for this version is already open
          EXISTING_PR=$(gh pr list --state open --head "$BRANCH_NAME" --json number -q '.[0].number' || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "ℹ️ Pull request #${EXISTING_PR} for version ${SWAGGER_VERSION} already exists. Pushing latest changes to branch."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B "$BRANCH_NAME"
            git add .
            git commit -m "chore: Refresh generated client for AirKey $SWAGGER_VERSION"
            git push origin "$BRANCH_NAME" --force
            exit 0
          fi
          
          # 3. Create new branch and open Pull Request
          echo "Opening new Pull Request for version ${SWAGGER_VERSION}..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "feat: Auto-update AirKey API client to $SWAGGER_VERSION"
          git push origin "$BRANCH_NAME"
          
          ASSIGNEES=$(jq -r '.prAssignees // [] | join(",")' .generator/openapi-config.json)
          REVIEWERS=$(jq -r '.prReviewers // [] | join(",")' .generator/openapi-config.json)
          
          PR_FLAGS=()
          if [ -n "$ASSIGNEES" ]; then
            PR_FLAGS+=(--assignee "$ASSIGNEES")
          fi
          if [ -n "$REVIEWERS" ]; then
            PR_FLAGS+=(--reviewer "$REVIEWERS")
          fi
          
          gh pr create \
            --title "feat: Update AirKey API Client to $SWAGGER_VERSION" \
            --body "Automated client update from EVVA AirKey specification. Please review the diff before merging. Merging this PR into \`main\` will automatically trigger the release tag creation." \
            --base main \
            --head "$BRANCH_NAME" \
            "${PR_FLAGS[@]}"
