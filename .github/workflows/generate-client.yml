name: Generate AirKey Client
on:
  workflow_dispatch:
  schedule:
    # Run every Monday at 06:00 UTC to check for upstream API updates
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    uses: United-Workspace/openapi-sdk-builder/.github/workflows/sdk-generate.yml@main
    with:
      spec-url: 'https://integration.api.airkey.evva.com/docs/swagger.json'
      generator-name: 'php'
      generator-version: 'latest'
      pr-title: 'feat: Update AirKey API Client'
      pr-reviewers: 'Nolanus'
      pr-assignees: 'Nolanus'
      protected-files: 'lib/ObjectSerializer.php'
    secrets: inherit
